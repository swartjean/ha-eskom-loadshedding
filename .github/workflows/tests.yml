name: "Tests"

on:
  push:
  pull_request:

jobs:
  pytest:
    name: "Normalizer unit tests"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - run: "pip install pytest"
      - run: "python -m pytest tests/ -v"
